name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm --filter backend tsc --noEmit

      - name: Lint
        run: pnpm --filter backend lint

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm --filter backend vitest run tests/unit --coverage
        env:
          NODE_ENV: test
          ACCESS_SECRET: test-access-secret-at-least-32-chars-long
          REFRESH_SECRET: test-refresh-secret-at-least-32-chars-long
          OTP_VERIFY_SECRET: test-otp-verify-secret-at-least-32-chars
          # Unit tests don't need DB/resend
          DATABASE_URL: postgresql://noop/noop
          DIRECT_URL: postgresql://noop/noop
          RESEND_API_KEY: re_test_noop
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: apps/backend/coverage/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: transitops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push schema to test DB
        run: pnpm --filter backend prisma db push --skip-generate
        env:
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/transitops_test
          DIRECT_URL: postgresql://testuser:testpassword@localhost:5432/transitops_test

      - name: Run integration tests
        run: pnpm --filter backend vitest run tests/integration
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/transitops_test
          DIRECT_URL: postgresql://testuser:testpassword@localhost:5432/transitops_test
          ACCESS_SECRET: test-access-secret-at-least-32-chars-long
          REFRESH_SECRET: test-refresh-secret-at-least-32-chars-long
          OTP_VERIFY_SECRET: test-otp-verify-secret-at-least-32-chars
          RESEND_API_KEY: re_test_noop
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
          PORT: 5001